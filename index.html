<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผังขบวนรับน้องขึ้นดอยคณะพยาบาลศาสตร์ มหาวิทยาลัยเชียงใหม่ ปีการศึกษา 2569</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f8fafc;
        }
        /* ซ่อนลูกศรใน input type number ถ้าใช้ */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .grid-row-blue { background-color: #e0f2fe; }
        .grid-row-brown { background-color: #f5ece5; }
        .grid-row-yellow { background-color: #fef9c3; }
        
        .input-cell {
            width: 100%;
            text-align: center;
            border: 1px solid #cbd5e1;
            border-radius: 0.375rem;
            padding: 0.25rem;
            transition: all 0.2s;
            background-color: rgba(255, 255, 255, 0.8);
        }
        .input-cell:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
            background-color: #ffffff;
        }
        .input-special {
            border-color: #fbcfe8;
            background-color: #fff1f2;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 p-4 md:p-8">

    <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-lg p-6 mb-10 overflow-x-auto">
        <div class="text-center mb-8">
            <h1 class="text-2xl md:text-3xl font-semibold text-blue-800 mb-2">ผังขบวนรับน้องขึ้นดอยคณะพยาบาลศาสตร์ มหาวิทยาลัยเชียงใหม่ ปีการศึกษา 2569</h1>
            <p class="text-slate-500">คณะพยาบาลศาสตร์ - ระบบจัดการแบบเรียลไทม์</p>
            
            <div id="connection-status" class="mt-2 inline-flex items-center text-sm text-amber-500 bg-amber-50 px-3 py-1 rounded-full border border-amber-200">
                <span class="w-2 h-2 rounded-full bg-amber-500 mr-2 animate-pulse"></span>กำลังเชื่อมต่อ...
            </div>
        </div>

        <!-- Top Role -->
        <div class="flex flex-col items-center justify-center mb-8">
            <div class="w-48 text-center bg-orange-100 p-3 rounded-lg border border-orange-200">
                <label class="block text-xs font-semibold text-orange-600 mb-1">เจเจ (ประสานงาน)</label>
                <input type="text" id="top_role" class="input-cell db-sync" placeholder="กรอกเลข/ชื่อ">
            </div>
        </div>

        <!-- Main Grid Area -->
        <div class="min-w-[800px]">
            <!-- Header Row -->
            <div class="grid grid-cols-12 gap-2 text-center font-semibold text-slate-600 text-sm mb-3 pb-2 border-b-2 border-slate-200">
                <div class="col-span-2 text-left pl-4">แถวที่</div>
                <div class="col-span-1">ซ้าย</div>
                <div class="col-span-2">ช่อง 1</div>
                <div class="col-span-2">ช่อง 2</div>
                <div class="col-span-2">ช่อง 3</div>
                <div class="col-span-2">ช่อง 4</div>
                <div class="col-span-1 pr-4 text-right">ขวา (พิเศษ)</div>
            </div>

            <!-- Grid Content will be injected here -->
            <div id="grid-container" class="space-y-2"></div>
        </div>

        <!-- Bottom Roles -->
        <div class="flex flex-wrap justify-center gap-6 mt-12 pt-8 border-t border-slate-200 min-w-[800px]">
            <div class="w-40 text-center bg-orange-100 p-3 rounded-lg border border-orange-200">
                <label class="block text-xs font-semibold text-orange-600 mb-1">ประสานงาน ปี 4</label>
                <input type="text" id="bottom_role_1" class="input-cell db-sync" placeholder="กรอกเลข/ชื่อ">
            </div>
            <div class="w-40 text-center bg-pink-100 p-3 rounded-lg border border-pink-200">
                <label class="block text-xs font-semibold text-pink-600 mb-1">อาร์ตูน (จราจร)</label>
                <input type="text" id="bottom_role_2" class="input-cell db-sync" placeholder="กรอกเลข/ชื่อ">
            </div>
            <div class="w-40 text-center bg-emerald-100 p-3 rounded-lg border border-emerald-200">
                <label class="block text-xs font-semibold text-emerald-600 mb-1">แม็ค (รถพยาบาล)</label>
                <input type="text" id="bottom_role_3" class="input-cell db-sync" placeholder="กรอกเลข/ชื่อ">
            </div>
        </div>
    </div>

    <script type="module">
        // 1. นำเข้า Firebase ผ่านลิงก์ CDN ที่รองรับการใช้งานบน Browser โดยตรง (ลบตัวที่ซ้ำกันออกแล้ว)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 2. ตั้งค่าคอนฟิก Firebase ของคุณ
        const firebaseConfig = {
            apiKey: "AIzaSyBGaEjURXti8qsyDzaXw3zusb8uVmtwHps",
            authDomain: "smonursecmu2026-seatmapkd.firebaseapp.com",
            projectId: "smonursecmu2026-seatmapkd",
            storageBucket: "smonursecmu2026-seatmapkd.firebasestorage.app",
            messagingSenderId: "393369058256",
            appId: "1:393369058256:web:0b3bbfa28be799c27a17d5",
            measurementId: "G-SZPH7YJYEP"
        };

        const appId = 'parade-app-2026';

        // 3. สร้างหน้าตาของตาราง (Grid UI)
        const gridContainer = document.getElementById('grid-container');
        const totalRows = 52;
        
        function getRowTheme(rowIndex) {
            if (rowIndex <= 18) return 'grid-row-blue text-blue-900 border-blue-200';
            if (rowIndex <= 35) return 'grid-row-brown text-amber-900 border-amber-200';
            return 'grid-row-yellow text-yellow-900 border-yellow-300';
        }

        for (let i = 1; i <= totalRows; i++) {
            const themeClass = getRowTheme(i);
            const rowHtml = `
                <div class="grid grid-cols-12 gap-2 items-center py-2 px-4 rounded-md border border-opacity-50 ${themeClass}">
                    <div class="col-span-2 font-medium">แถวที่ ${i}</div>
                    
                    <div class="col-span-1">
                        <input type="text" id="r${i}_left" class="input-cell db-sync" placeholder="-" title="ตำแหน่งซ้ายสุด แถว ${i}">
                    </div>

                    <div class="col-span-2">
                        <input type="text" id="r${i}_c1" class="input-cell db-sync font-bold" placeholder="เลข">
                    </div>
                    <div class="col-span-2">
                        <input type="text" id="r${i}_c2" class="input-cell db-sync font-bold" placeholder="เลข">
                    </div>
                    <div class="col-span-2">
                        <input type="text" id="r${i}_c3" class="input-cell db-sync font-bold" placeholder="เลข">
                    </div>
                    <div class="col-span-2">
                        <input type="text" id="r${i}_c4" class="input-cell db-sync font-bold" placeholder="เลข">
                    </div>

                    <div class="col-span-1 flex justify-end">
                        <input type="text" id="r${i}_right" class="input-cell input-special db-sync text-sm" placeholder="พิเศษ">
                    </div>
                </div>
            `;
            gridContainer.insertAdjacentHTML('beforeend', rowHtml);
        }

        // 4. เริ่มต้นระบบ Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        // กำหนดตำแหน่งเก็บข้อมูลใน Database
        const docRef = doc(db, 'artifacts', appId, 'public_data', 'parade_formation');

        // 5. ระบบส่งข้อมูลขึ้น Firebase แบบประหยัดโควต้า (Debounce)
        let updateTimeout = null;
        let pendingUpdates = {};

        const syncToFirebase = async () => {
            if (Object.keys(pendingUpdates).length === 0) return;
            
            const updatesToPush = { ...pendingUpdates };
            pendingUpdates = {}; 
            
            try {
                await updateDoc(docRef, updatesToPush);
            } catch (error) {
                console.error("กำลังสร้างเอกสารใหม่...", error);
                try {
                    await setDoc(docRef, updatesToPush, { merge: true });
                } catch (e) {
                    console.error("บันทึกข้อมูลไม่สำเร็จ:", e);
                }
            }
        };

        const handleInput = (e) => {
            const elementId = e.target.id;
            const value = e.target.value;
            
            pendingUpdates[elementId] = value;
            
            if (updateTimeout) clearTimeout(updateTimeout);
            updateTimeout = setTimeout(syncToFirebase, 600); 
        };

        document.querySelectorAll('.db-sync').forEach(input => {
            input.addEventListener('input', handleInput);
        });

        // 6. ฟังก์ชันเริ่มการซิงค์ข้อมูล (ล็อกอินแบบไม่ต้องใช้รหัสผ่าน และดึงข้อมูล)
        const startSync = async () => {
            try {
                // ยืนยันตัวตนแบบ Anonymous (ใครมีลิงก์ก็เข้าได้)
                await signInAnonymously(auth);

                // เช็คว่ามีเอกสารนี้ในฐานข้อมูลหรือยัง ถ้ายังให้สร้างเตรียมไว้
                const docSnap = await getDoc(docRef);
                if (!docSnap.exists()) {
                    await setDoc(docRef, {});
                }

                // แสดงผลว่าเชื่อมต่อสำเร็จ
                document.getElementById('connection-status').innerHTML = '<span class="w-2 h-2 rounded-full bg-green-500 mr-2"></span>ออนไลน์ (Real-time)';
                document.getElementById('connection-status').className = 'mt-2 inline-flex items-center text-sm text-green-600 bg-green-50 px-3 py-1 rounded-full border border-green-200 shadow-sm';

                // รอรับข้อมูลเรียลไทม์เมื่อมีการเปลี่ยนแปลงจากคนอื่น
                onSnapshot(docRef, (doc) => {
                    if (doc.exists()) {
                        const data = doc.data();
                        
                        // เช็คช่องที่ผู้ใช้กำลังพิมพ์อยู่ เพื่อไม่ให้ข้อมูลใหม่มาทับขณะกำลังพิมพ์
                        const activeElementId = document.activeElement ? document.activeElement.id : null;
                        
                        Object.keys(data).forEach(key => {
                            const inputEl = document.getElementById(key);
                            if (inputEl && key !== activeElementId) {
                                if (inputEl.value !== data[key]) {
                                    inputEl.value = data[key] || '';
                                }
                            }
                        });
                    }
                }, (error) => {
                    console.error("Firebase listen error:", error);
                    document.getElementById('connection-status').innerHTML = '⚠️ ขาดการเชื่อมต่อ (เช็คตั้งค่า Rules ใน Firebase)';
                    document.getElementById('connection-status').className = 'mt-2 inline-flex items-center text-sm text-red-500 bg-red-50 px-3 py-1 rounded-full border border-red-200';
                });

            } catch (error) {
                console.error("Auth error:", error);
                document.getElementById('connection-status').innerHTML = '⚠️ ล้มเหลว (ต้องเปิดใช้งาน Anonymous ใหมวด Authentication ใน Firebase ก่อน)';
                document.getElementById('connection-status').className = 'mt-2 inline-flex items-center text-sm text-red-500 bg-red-50 px-3 py-1 rounded-full border border-red-200';
            }
        };

        // เริ่มทำงานเมื่อเปิดเว็บ
        startSync();
    </script>
</body>
</html>
